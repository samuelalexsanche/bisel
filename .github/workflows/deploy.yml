name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build estático
        env:
          DEPLOY_TARGET: pages
          # Dominio propio: el sitio cuelga de la raíz, no de /<repo>, así que
          # NO va basePath. El CNAME de public/ es lo que ata Pages al dominio.
          NEXT_PUBLIC_SITE_URL: https://bisel3d.com
          # Indexable: sin esto el sitio va con noindex y no hay SEO que valga.
          NEXT_PUBLIC_INDEXABLE: "true"
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
