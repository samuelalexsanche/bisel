name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build estático
        env:
          DEPLOY_TARGET: pages
          BASE_PATH: /bisel
          # Los canónicos, el sitemap y el JSON-LD apuntan a donde el sitio
          # vive de verdad. Además activa el noindex del preview (§14.1).
          NEXT_PUBLIC_SITE_URL: https://samuelalexsanche.github.io/bisel
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
