name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build estático
        env:
          DEPLOY_TARGET: pages
          # Dominio propio: el sitio cuelga de la raíz, no de /<repo>, así que
          # NO va basePath. El CNAME de public/ es lo que ata Pages al dominio.
          NEXT_PUBLIC_SITE_URL: https://bisel3d.com
          # Indexable: sin esto el sitio va con noindex y no hay SEO que valga.
          NEXT_PUBLIC_INDEXABLE: "true"
          # Meta Pixel (§14.7): se activa poniendo el ID en un secret del repo
          # (Settings → Secrets → Actions → META_PIXEL_ID). Vacío = sin pixel.
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # IndexNow — ping instantáneo a Bing, Yandex y Seznam tras cada deploy.
      # Bing es el buscador que alimenta las respuestas de ChatGPT, así que
      # este ping es la puerta de entrada a que los motores generativos citen
      # el sitio (§9 GEO). La llave vive en public/<llave>.txt (pública por
      # diseño: es la prueba de propiedad del archivo, no una credencial).
      - name: Ping IndexNow
        run: |
          KEY_FILE=$(ls public | grep -E '^[0-9a-f]{32}\.txt$' | head -1 || true)
          if [ -z "$KEY_FILE" ]; then
            echo "No se encontró la llave IndexNow; se omite el ping."
            exit 0
          fi
          KEY="${KEY_FILE%.txt}"
          echo "Llave IndexNow: $KEY"
          # La llave viaja por variable de entorno: el heredoc va con comillas
          # (<<'PYEOF'), así que $KEY NO se expande dentro del script.
          INDEXNOW_KEY="$KEY" python3 - <<'PYEOF'
          import json, os, re, sys, urllib.request, urllib.error
          key = os.environ["INDEXNOW_KEY"]
          try:
              sitemap = open("out/sitemap.xml", encoding="utf-8").read()
          except FileNotFoundError:
              print("No hay sitemap; se omite el ping.")
              sys.exit(0)
          urls = re.findall(r"<loc>([^<]+)</loc>", sitemap)
          payload = {
              "host": "bisel3d.com",
              "key": key,
              "keyLocation": f"https://bisel3d.com/{key}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(f"IndexNow OK: {r.status} · {len(urls)} URLs")
          except urllib.error.HTTPError as e:
              print(f"IndexNow HTTP {e.code}: {e.read().decode()[:200]}")
          PYEOF

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
